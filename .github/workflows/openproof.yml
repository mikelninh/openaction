name: OpenProof core
on:
  pull_request:
    paths:
      - 'openproof/**'
      - '.github/workflows/openproof.yml'
  push:
    branches: [main]
    paths:
      - 'openproof/**'
      - '.github/workflows/openproof.yml'
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check openproof/openproof.js
      - run: node openproof/tests/openproof.mjs

  compact-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Compact devtools
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          compact update 0.31.1
          compact compile --version
          compact compile --runtime-version
      - name: Compile OpenProof ZK contracts
        shell: bash
        run: |
          rm -rf openproof/contracts/managed/openproof openproof/contracts/managed/openproof-signing
          compact compile \
            --compact-path openproof/contracts \
            openproof/contracts/openproof.compact \
            openproof/contracts/managed/openproof
          compact compile \
            --compact-path openproof/contracts \
            openproof/contracts/openproof-signing.compact \
            openproof/contracts/managed/openproof-signing
      - name: Assert generated proof + helper artifacts
        shell: bash
        run: |
          test -f openproof/contracts/managed/openproof/contract/index.js
          test -d openproof/contracts/managed/openproof/keys
          test -d openproof/contracts/managed/openproof/zkir
          find openproof/contracts/managed/openproof/keys -type f | grep -q .
          find openproof/contracts/managed/openproof/zkir -type f | grep -q .

          # Pure issuer helpers need generated callable bindings, but do not
          # require proving keys because they create no ledger transition.
          test -f openproof/contracts/managed/openproof-signing/contract/index.js
          grep -q 'familyAttestationChallenge' openproof/contracts/managed/openproof-signing/contract/index.js
          grep -q 'agentAttestationChallenge' openproof/contracts/managed/openproof-signing/contract/index.js
          grep -q 'careAttestationChallenge' openproof/contracts/managed/openproof-signing/contract/index.js
          echo 'OpenProof proof circuits + issuer helper bindings generated.'
      - name: Install Midnight test dependencies
        working-directory: openproof/contracts
        run: npm install --ignore-scripts
      - name: Typecheck private-state and issuer adapters
        working-directory: openproof/contracts
        run: npm run typecheck
      - name: Run adversarial Compact simulator
        working-directory: openproof/contracts
        run: npm run test:phase2
