openapi: 3.1.0
info:
  title: OpenAction Gateway
  version: 1.0.0-rc1
  description: Minimal provider-neutral HTTP contract for OpenAction actions, scoped approvals and outcomes.
servers:
  - url: https://example.org/openaction
paths:
  /v1/actions:
    post:
      summary: Propose an action
      operationId: proposeAction
      requestBody:
        required: true
        content:
          application/vnd.openaction+json:
            schema: {$ref: ./spec/1.0/openaction.schema.json}
      responses:
        '202': {description: Accepted for policy / approval processing}
  /v1/actions/{actionId}:
    get:
      summary: Read action state
      operationId: getAction
      parameters:
        - {name: actionId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Current action
          content:
            application/vnd.openaction+json:
              schema: {$ref: ./spec/1.0/openaction.schema.json}
  /v1/actions/{actionId}/approval-receipts:
    post:
      summary: Attach an accountable approval decision receipt
      operationId: attachApprovalReceipt
      parameters:
        - {name: actionId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: ./spec/1.0/approval-receipt.schema.json}
      responses:
        '200': {description: Receipt accepted and scope/policy checked}
        '409': {description: Receipt scope, proof or policy does not satisfy this action}
  /v1/actions/{actionId}/complete:
    post:
      summary: Record a real-world outcome
      operationId: completeAction
      parameters:
        - {name: actionId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, summary]
              properties:
                status: {enum: [succeeded, failed, partial, unknown]}
                summary: {type: string}
                receipt: {type: string}
                metrics: {type: object, additionalProperties: true}
      responses:
        '200': {description: Outcome recorded}
  /v1/change-impact:
    post:
      summary: Evaluate declared changes against gate dependencies
      operationId: evaluateChangeImpact
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: ./spec/1.0/change-impact.schema.json}
      responses:
        '200': {description: Change impact accepted for human review}
webhooks:
  actionEvent:
    post:
      summary: Optional CloudEvents-compatible action lifecycle delivery
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema: {type: object}
      responses:
        '204': {description: Event accepted}
